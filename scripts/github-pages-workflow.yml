# Install at .github/workflows/pages.yml once the gh token carries the
# 'workflow' scope:  gh auth refresh -h github.com -s workflow
# Kept here because an OAuth token without that scope cannot push a file
# under .github/workflows/, by git or by the contents API.
name: Pages

# The site is generated, never committed: scripts/build_site.py runs here and
# its output is published straight to Pages. Nothing is pushed back to main,
# which keeps this workflow out of the way of the other agents committing to
# this repository.

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'out/papers/**'
      - 'claims/**'
      - 'docs/classics/README.md'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Generate the site
        run: python3 scripts/build_site.py

      - name: Check that the landing page was written
        run: test -s docs/index.html && test -d docs/notes

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
